services:

  twitchbot:
    container_name: twitchbot-container
    image: ghcr.io/helltar/twitchbot:latest
    restart: unless-stopped
    env_file: .env
    # reaps orphaned ffmpeg/streamlink children (java as PID 1 doesn't)
    init: true
    # hardening: immutable root fs, no Linux capabilities, no privilege escalation via setuid binaries
    read_only: true
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    volumes:
      # SQLite database file (+ its -wal/-shm companions)
      - bot-data:/data
    # clips (streamlink .ts + ffmpeg .mp4, up to ~100 MB per channel) and the healthcheck file live here;
    # tmpfs is RAM-backed, so keep BOT_TMP_SIZE below BOT_MEM_LIMIT
    tmpfs:
      - /tmp:size=${BOT_TMP_SIZE:-1g},mode=1777,nosuid,nodev
    # caps the damage if many users spam /clip at once (every clip runs streamlink + ffmpeg)
    mem_limit: ${BOT_MEM_LIMIT:-2g}
    cpus: ${BOT_CPUS:-2}
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
